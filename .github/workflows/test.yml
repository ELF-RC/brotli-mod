# Test the binaries produced by the Build workflow.

name: Test

on:
  workflow_run:
    workflows:
      - Build
    types:
      - completed

permissions:
  actions: read
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.id }}
  cancel-in-progress: true

jobs:
  compression:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    name: Compression test (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-22.04
            machine: x86_64
          - arch: arm64
            runner: ubuntu-22.04-arm
            machine: aarch64

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Verify runner architecture
        run: test "$(uname -m)" = "${{ matrix.machine }}"

      - name: Download build artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: brotli-${{ matrix.arch }}
          path: artifact
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Compress and decompress with the artifact
        shell: bash
        run: |
          set -Eeuo pipefail

          brotli="$PWD/artifact/brotli"
          chmod 755 "$brotli"
          test -x "$brotli"
          "$brotli" -V

          workdir="$(mktemp -d)"
          trap 'rm -rf "$workdir"' EXIT

          python3 - "$workdir/input.bin" <<'PY'
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          data = (b"Brotli artifact compression test\\n" * 16384)
          data += bytes(range(256)) * 256
          path.write_bytes(data)
          PY

          for quality in 0 5 9 11; do
            compressed="$workdir/input.q${quality}.br"
            restored="$workdir/restored.q${quality}.bin"

            "$brotli" -q "$quality" -f -o "$compressed" "$workdir/input.bin"
            "$brotli" -t "$compressed"
            "$brotli" -d -f -o "$restored" "$compressed"
            cmp "$workdir/input.bin" "$restored"
          done

          "$brotli" -q 6 -c "$workdir/input.bin" > "$workdir/stream.br"
          "$brotli" -d -c "$workdir/stream.br" > "$workdir/stream.out"
          cmp "$workdir/input.bin" "$workdir/stream.out"
